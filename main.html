<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Federico Daniel Alegría Gómez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── Gruvbox Light ── */
:root[data-theme="light"]{
  --bg:#fbf1c7;--bg1:#ebdbb2;--bg2:#d5c4a1;
  --ink:#3c3836;--ink-mid:#665c54;--ink-light:#928374;
  --accent:#076678;--rule:#d5c4a1;--yr:#b57614;
  color-scheme:light;
}
/* ── Gruvbox Dark ── */
:root[data-theme="dark"]{
  --bg:#282828;--bg1:#3c3836;--bg2:#504945;
  --ink:#ebdbb2;--ink-mid:#bdae93;--ink-light:#928374;
  --accent:#83a598;--rule:#504945;--yr:#fabd2f;
  color-scheme:dark;
}
/* fallback for OS preference before JS runs */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#282828;--bg1:#3c3836;--bg2:#504945;
    --ink:#ebdbb2;--ink-mid:#bdae93;--ink-light:#928374;
    --accent:#83a598;--rule:#504945;--yr:#fabd2f;
    color-scheme:dark;
  }
}

--serif:'Lora',Georgia,serif;
--mono:'JetBrains Mono','Fira Mono',monospace;

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--serif,Lora,Georgia,serif);
  font-size:17px;line-height:1.75;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.cv{max-width:800px;margin:0 auto;padding:4rem 2rem 6rem;}

/* ── header ── */
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2.5rem;gap:1rem;}
.hd-left{}
.hd-name{font-family:'Lora',Georgia,serif;font-size:2rem;font-weight:500;letter-spacing:.01em;line-height:1.15;}
.hd-contact{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.73rem;color:var(--ink-mid);margin-top:.5rem;letter-spacing:.02em;
}
.hd-contact a{color:var(--ink-mid);text-decoration:none;border-bottom:1px solid var(--rule);}
.hd-contact a:hover{color:var(--accent);border-color:var(--accent);}

/* ── controls (lang + theme) ── */
.controls{display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;flex-shrink:0;}
.toggle-row{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;}
.toggle-row button{
  background:none;border:none;cursor:pointer;
  padding:.3rem .65rem;
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.68rem;color:var(--ink-mid);letter-spacing:.06em;
  transition:background .12s,color .12s;
}
.toggle-row button.on{background:var(--accent);color:var(--bg);}
.toggle-row button:not(.on):hover{background:var(--bg1);}

/* ── bio ── */
.bio{
  font-family:'Lora',Georgia,serif;
  font-size:1.02rem;line-height:1.82;
  border-left:2px solid var(--accent);
  padding-left:1.2rem;margin-bottom:3rem;
  max-width:66ch;
}

/* ── section ── */
.sec{margin-bottom:2.75rem;}
.sec-hd{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.67rem;font-weight:400;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-light);
  margin-bottom:1.2rem;padding-bottom:.4rem;
  border-bottom:1px solid var(--rule);
}

/* ── entry row ── */
.entry{display:grid;grid-template-columns:106px 1fr;gap:0 1.5rem;margin-bottom:1.25rem;}
.edate{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.72rem;color:var(--ink-light);
  padding-top:.22rem;line-height:1.5;text-align:right;
}
.etitle{font-family:'Lora',Georgia,serif;font-size:.97rem;font-weight:500;line-height:1.35;}
.esub{font-family:'JetBrains Mono','Fira Mono',monospace;font-size:.73rem;color:var(--ink-mid);margin-top:.15rem;letter-spacing:.01em;}
.edetail{font-family:'Lora',Georgia,serif;font-size:.87rem;color:var(--ink-mid);margin-top:.2rem;font-style:italic;}
.elist{list-style:none;margin-top:.3rem;}
.elist li{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.7rem;color:var(--ink-mid);
  padding-left:1.2em;position:relative;line-height:1.6;
}
.elist li::before{content:'›';position:absolute;left:0;color:var(--accent);}

/* ── research groups ── */
.rg{margin-bottom:1.6rem;}
.rg-hd{
  cursor:pointer;display:flex;align-items:baseline;
  flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem;user-select:none;
}
.rg-inst{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.68rem;color:var(--ink-light);letter-spacing:.03em;
  transition:color .12s;
}
.rg-hd:hover .rg-inst{color:var(--accent);}
.rg-prog{font-family:'Lora',Georgia,serif;font-size:.95rem;font-weight:500;color:var(--ink);}
.rg-tog{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.66rem;color:var(--ink-light);margin-left:auto;
  white-space:nowrap;
}
.rlist{list-style:none;padding-left:1rem;border-left:1px solid var(--rule);}
.rlist.hidden{display:none;}
.rlist li{
  font-family:'Lora',Georgia,serif;font-style:italic;
  font-size:.88rem;color:var(--ink-mid);line-height:1.6;
  padding:.22rem 0;border-bottom:1px solid var(--rule);
}
.rlist li:last-child{border-bottom:none;}

/* ── studies prose ── */
.stxt{font-family:'Lora',Georgia,serif;font-size:.88rem;color:var(--ink-mid);line-height:1.8;}
.yr{font-family:'JetBrains Mono','Fira Mono',monospace;color:var(--yr);font-size:.76rem;}

/* ── affiliations ── */
.alist{list-style:none;}
.ait{padding:.5rem 0;border-bottom:1px solid var(--rule);}
.ait:last-child{border-bottom:none;}
.ainame{font-family:'Lora',Georgia,serif;font-size:.95rem;font-weight:500;}
.aiurl{
  display:block;
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.67rem;color:var(--accent);
  text-decoration:none;margin-top:.08rem;word-break:break-all;
}
.aiurl:hover{text-decoration:underline;}

/* ── publications ── */
.plist{list-style:none;}
.pit{padding:.55rem 0;border-bottom:1px solid var(--rule);}
.pit:last-child{border-bottom:none;}
.ptitle{font-family:'Lora',Georgia,serif;font-size:.95rem;font-weight:500;}
.purl{
  display:block;
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.67rem;color:var(--accent);
  text-decoration:none;margin-top:.08rem;word-break:break-all;
}
.purl:hover{text-decoration:underline;}

/* ── hint ── */
.hint{
  font-family:'JetBrains Mono','Fira Mono',monospace;
  font-size:.7rem;color:var(--ink-light);margin-bottom:1rem;
}

/* ── responsive ── */
@media(max-width:600px){
  .cv{padding:2rem 1.25rem 4rem;}
  .hd{flex-direction:column;}
  .hd-name{font-size:1.65rem;}
  .controls{flex-direction:row;align-items:center;}
  .entry{grid-template-columns:1fr;}
  .edate{text-align:left;margin-bottom:.05rem;}
  .rg-tog{margin-left:.5rem;}
}
</style>

const open={};
let lang='es';

function sec(title,html){return`<div class="sec"><div class="sec-hd">${title}</div>${html}</div>`;}

function entries(arr){
  return arr.map(e=>{
    const x=e.x?`<div class="edetail">${e.x}</div>`:'';
    const c=e.c?`<ul class="elist">${e.c.map(i=>`<li>${i}</li>`).join('')}</ul>`:'';
    return`<div class="entry"><div class="edate">${e.d}</div><div><div class="etitle">${e.t}</div><div class="esub">${e.s}</div>${x}${c}</div></div>`;
  }).join('');
}

function toggle(id){
  open[id]=!open[id];
  const l=document.getElementById('rl'+id);
  const b=document.getElementById('rb'+id);
  const lb=D.lbl[lang];
  if(l){l.classList.toggle('hidden',!open[id]);}
  if(b){b.textContent=open[id]?lb.hide:lb.show+' ('+b.dataset.n+')';}
}

function resHtml(l){
  return D.res[l].map((g,i)=>{
    const id=l+i;
    const isOpen=!!open[id];
    return`<div class="rg">
      <div class="rg-hd" onclick="toggle('${id}')">
        <span class="rg-inst">${g.inst}</span>
        <span class="rg-prog">${g.prog}</span>
        <span class="rg-tog" id="rb${id}" data-n="${g.items.length}">${isOpen?D.lbl[l].hide:D.lbl[l].show+' ('+g.items.length+')'}</span>
      </div>
      <ul class="rlist${isOpen?'':' hidden'}" id="rl${id}">
        ${g.items.map(it=>`<li>${it}</li>`).join('')}
      </ul>
    </div>`;
  }).join('');
}

function render(l){
  lang=l;
  document.documentElement.lang=l;
  document.getElementById('bes').classList.toggle('on',l==='es');
  document.getElementById('ben').classList.toggle('on',l==='en');
  const lb=D.lbl[l];
  document.getElementById('body').innerHTML=`
    <p class="bio">${D.bio[l]}</p>
    ${sec(lb.edu,entries(D.edu[l]))}
    ${sec(lb.work,entries(D.work[l]))}
    ${sec(lb.acad,entries(D.acad[l]))}
    ${sec(lb.teach,entries(D.teach[l]))}
    ${sec(lb.res,`<p class="hint">${lb.hint}</p>${resHtml(l)}`)}
    ${sec(lb.cult,`<p class="stxt">${D.stud.cult[l]}</p>`)}
    ${sec(lb.rstu,`<p class="stxt">${D.stud.rstu[l]}</p>`)}
    ${sec(lb.oth,`<p class="stxt">${D.stud.oth[l]}</p>`)}
    ${sec(lb.aff,`<ul class="alist">${D.aff.map(a=>`<li class="ait"><div class="ainame">${a[l]}</div><a class="aiurl" href="${a.url}" target="_blank" rel="noopener">${a.url}</a></li>`).join('')}</ul>`)}
    ${sec(lb.pub,`<ul class="plist">${D.pub.map(p=>`<li class="pit"><div class="ptitle">${p[l]}</div><a class="purl" href="${p.url}" target="_blank" rel="noopener">${p.url}</a></li>`).join('')}</ul>`)}
  `;
}

function setTheme(t){
  document.documentElement.dataset.theme=t;
  document.getElementById('blt').classList.toggle('on',t==='light');
  document.getElementById('bdk').classList.toggle('on',t==='dark');
}

function go(l){render(l);}

// init from OS preference
const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(prefersDark?'dark':'light');
render('es');
</script>
